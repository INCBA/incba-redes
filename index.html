  <style>
    /* Colores y tipografía: los mismos de incba.com.ar */
    :root {
      --navy: #0B1C2D;
      --navy-2: #0F172A;
      --navy-3: #0D2137;
      --accent: #00C896;
      --txt: #E2E8F0;
      --txt-2: #94A3B8;
      --superficie: rgba(255, 255, 255, .045);
      --borde: rgba(255, 255, 255, .10);
      --radio: 12px;
      --t: .25s cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; }

    html { background: var(--navy); -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(44px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--txt);
      background:
        radial-gradient(50rem 26rem at 50% -8%, rgba(0, 200, 150, .14), transparent 70%),
        linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 50%, var(--navy-3) 100%);
      background-attachment: fixed;
    }

    /* Grilla sutil, como en la web */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 25%, transparent 70%);
              mask-image: radial-gradient(ellipse at 50% 0%, #000 25%, transparent 70%);
    }

    main { position: relative; width: 100%; max-width: 440px; }

    /* ---------- Perfil ---------- */
    .perfil { text-align: center; margin-bottom: 30px; }

    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--navy), 0 0 0 5px var(--accent), 0 14px 36px rgba(0, 200, 150, .28);
    }

    h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: .03em; }
    .rubro { margin-top: 2px; color: var(--accent); font-size: .95rem; font-weight: 700; }
    .lema { margin-top: 10px; color: var(--txt-2); font-size: .9rem; font-weight: 500; }

    /* ---------- Botones ---------- */
    .links { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 14px 18px;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      background: var(--superficie);
      color: var(--txt);
      font-size: .98rem;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform var(--t), background var(--t), border-color var(--t), box-shadow var(--t);
    }
    .btn:hover { transform: translateY(-2px); border-color: rgba(0, 200, 150, .55); background: rgba(0, 200, 150, .08); }
    .btn:active { transform: translateY(0); }
    .btn svg { flex: none; width: 20px; height: 20px; }
    .btn .ir { margin-left: auto; opacity: .55; }

    .btn:focus-visible,
    .redes a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Destacado: diagnóstico gratuito */
    .btn--destacado {
      position: relative;
      overflow: hidden;
      min-height: 76px;
      padding: 16px 20px;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--navy);
      box-shadow: 0 12px 32px -10px rgba(0, 200, 150, .6);
    }
    .btn--destacado:hover { background: #14D6A4; border-color: #14D6A4; box-shadow: 0 16px 36px -10px rgba(0, 200, 150, .75); }
    .btn--destacado .ir { opacity: .8; }
    .btn__texto { display: flex; flex-direction: column; line-height: 1.25; }
    .btn__texto strong { font-size: 1.06rem; font-weight: 800; }
    .btn__texto small { font-size: .82rem; font-weight: 600; opacity: .78; }
    .btn--destacado::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .38) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: brillo 5s ease-in-out 1.5s infinite;
    }
    @keyframes brillo {
      0%, 62% { transform: translateX(-120%); }
      86%, 100% { transform: translateX(120%); }
    }

    /* Grupos Argentina / Chile */
    .grupo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 2px -2px;
      color: var(--txt-2);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .grupo svg { width: 15px; height: 15px; color: var(--accent); }
    .par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .par .btn { justify-content: center; padding: 14px 10px; }
    .bandera { flex: none; width: 22px; height: 15px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2); }

    /* ---------- Íconos de redes ---------- */
    .redes { display: flex; justify-content: center; gap: 14px; margin-top: 28px; }
    .redes a {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid var(--borde);
      border-radius: 50%;
      background: var(--superficie);
      color: var(--txt);
      transition: transform var(--t), background var(--t), color var(--t), border-color var(--t);
    }
    .redes a:hover { transform: translateY(-2px); background: var(--accent); border-color: var(--accent); color: var(--navy); }
    .redes svg { width: 21px; height: 21px; }

    footer { margin-top: auto; padding-top: 40px; color: var(--txt-2); font-size: .78rem; text-align: center; }
    footer a { color: inherit; }

    /* Entrada escalonada */
    .perfil, .links > *, .redes { animation: entrar .55s cubic-bezier(.2, .7, .2, 1) both; }
    .links > :nth-child(1) { animation-delay: .08s; }
    .links > :nth-child(2), .links > :nth-child(3) { animation-delay: .14s; }
    .links > :nth-child(4), .links > :nth-child(5) { animation-delay: .2s; }
    .links > :nth-child(6) { animation-delay: .26s; }
    .redes { animation-delay: .32s; }
    @keyframes entrar { from { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
